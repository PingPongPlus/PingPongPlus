name: Git Ship

on:
  schedule:
    - cron: '23 * * * *' # Hourly, at minute 23.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-ship-output
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required by the separate output-branch publishing step.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate the past year of activity
        id: ship
        uses: PingPongPlus/git-ship@main
        with:
          username: ${{ github.repository_owner }}
          data-window: year # Past 365 days, refreshed every hour.
          lighthouse-beam: 'true' # Set to 'false' to disable the rotating ray.
          watermark: 'true' # Set to 'false' to hide the period caption.
          display-commits: 'true' # Full past-month commit total at the bottom right.
          output-dir: git-ship-output
          huge-cargo-ship: 'true'
          cargo-logos: 'true'
          token: ${{ github.token }}
      - name: Publish only images to the output branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHIP_PUBLISH_SCRIPT: ${{ steps.ship.outputs.publish-script }}
          SHIP_ASSETS: ${{ steps.ship.outputs.output-dir }}
          SHIP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python "$SHIP_PUBLISH_SCRIPT" \
            --assets-dir "$SHIP_ASSETS" \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "$SHIP_DEFAULT_BRANCH"
