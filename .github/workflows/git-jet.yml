name: Git Jet

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Share Git Ship's lock because both workflows publish to the output branch.
concurrency:
  group: git-ship-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate the past year of activity
        id: jet
        uses: PingPongPlus/git-jet@master
        with:
          username: ${{ github.repository_owner }}
          days: '365'
          jets: '2'
      - name: Publish README images
        env:
          JET_PUBLISH_SCRIPT: ${{ steps.jet.outputs.publish-script }}
          JET_ASSETS: ${{ github.workspace }}/git-jet-output
          JET_REPOSITORY: ${{ github.repository }}
          JET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python "$JET_PUBLISH_SCRIPT" --assets-dir "$JET_ASSETS" \
            --repository "$JET_REPOSITORY" --default-branch "$JET_DEFAULT_BRANCH"
